<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - CSRF Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 620px; margin: 60px auto; padding: 0 20px; }
    form { border: 1px solid #ccc; border-radius: 10px; padding: 24px; }
    label { display: block; margin-top: 14px; }
    input { width: 100%; padding: 9px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 18px; }
    .error { color: #a00; }
  </style>
</head>
<body>
  <h1>Demo Login</h1>
  <p>Use only the fake credentials supplied for this local demonstration.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="{{ category }}">{{ message }}</p>
    {% endfor %}
  {% endwith %}
  <form method="post" action="{{ url_for('login') }}">
    <label for="username">Username</label>
    <input id="username" name="username" value="victim" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" value="password123" required>

    <button type="submit">Log in</button>
  </form>
</body>
</html>
