<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - CSRF Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 680px; margin: 50px auto; padding: 0 20px; }
    .notice { background: #fff4cc; border: 1px solid #d4b44c; padding: 12px; border-radius: 8px; }
    form { border: 1px solid #ccc; border-radius: 10px; padding: 24px; margin-top: 18px; }
    label { display: block; margin-top: 14px; }
    input, textarea { width: 100%; padding: 9px; box-sizing: border-box; }
    textarea { min-height: 100px; }
    button { margin-top: 18px; padding: 10px 18px; }
    .success { color: #075; }
  </style>
</head>
<body>
  <h1>Profile for {{ username }}</h1>
  <p class="notice"><strong>Training application:</strong> this form is intentionally missing CSRF protection.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="{{ category }}">{{ message }}</p>
    {% endfor %}
  {% endwith %}

  <form method="post" action="{{ url_for('profile') }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" required>

    <label for="bio">Bio</label>
    <textarea id="bio" name="bio">{{ bio }}</textarea>

    <!-- Intentionally no anti-CSRF token in this vulnerable version. -->
    <button type="submit">Update profile</button>
  </form>

  <p><a href="{{ url_for('logout') }}">Log out</a></p>
</body>
</html>
